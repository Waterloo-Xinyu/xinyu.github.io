# 全局参数
params:
  favicon: "fav.png"
  mathjax: true
  animate: true
  customScripts: |-
    <style> 
      /* ================= 全局统一 Arial 字体 ================= */
      body, h1, h2, h3, h4, h5, h6, p, a, span, div, li, ul, strong, em {
          font-family: Arial, sans-serif !important;
      }
      /* 隐藏页脚的主题版权信息 */
      footer .text-center { 
          display: none !important; 
      }
      #visitor-counter-wrapper { /* 假设你给计数器容器加了这个 ID */
          margin-top: 20px;
          display: block !important;
      }

      /* 修改导航栏品牌区：变为 Flex 布局并垂直居中 */
      .navbar-brand {
          display: flex !important;
          align-items: center !important; 
          padding-top: 0 !important;
          padding-bottom: 0 !important;
      }
    
      /* 设置 Logo 大小 */
      .navbar-brand img { 
          height: 100px !important; 
          width: auto !important; 
          margin-right: 15px; 
      } 
    
      /* 1. 放大底部 Footer 的 Logo */
      footer img {
          height: 100px !important; 
          width: auto !important;
          margin-top: 20px !important;
          margin-bottom: 10px !important;
      }

      /* 确保文字部分也垂直居中，不带额外的边距 */
      .navbar-brand span, .navbar-brand {
          line-height: 1 !important;
      }
    
      /* 栅格布局调整 */
      #about ul { grid-template-columns: repeat(3, 1fr) !important; }
      @media (max-width: 768px) { #about ul { grid-template-columns: repeat(2, 1fr) !important; } }
    
      /* ================= 学术论文排版 (核武器终结版) ================= */
    
      /* 1. 隐藏左侧时间/分类列，让右侧内容占满 100% 宽度 */
      #experience .tab-content .col-md-4 { display: none !important; }
      #experience .tab-content .col-md-8 { width: 100% !important; max-width: 100% !important; flex: 0 0 100% !important; }
    
      /* 2. 【核武器拦截】：在论文内容区，除了我们的段落 <p>，其他的蓝字、横杠、占位符统统隐形！ */
      #experience .tab-content .col-md-8 > *:not(p) { 
          display: none !important; 
      }
    
      /* 3. 面板重置计数器 */
      #experience .tab-pane { counter-reset: pubCounter; }
    
      /* 4. 完美的内部安全区悬挂缩进（绝不错位、不溢出） */
      #experience .tab-content .col-md-8 p {
          font-size: 16px !important; 
          line-height: 1.6 !important;
          margin-bottom: 1.2rem !important;
          position: relative !important;
          padding-left: 35px !important; 
          text-indent: 0 !important;     
          counter-increment: pubCounter;
      }
    
      /* 将编号精准放置在刚才腾出的 35px 安全区内 */
      #experience .tab-content .col-md-8 p::before {
          content: "[" counter(pubCounter) "]" !important;
          position: absolute !important;
          left: 0 !important; 
          top: 0 !important;
          font-weight: bold !important;
      }
      
      /* --- 增大导航栏菜单项字体 --- */
      .navbar-nav .nav-link {
          font-size: 18px !important;    
          font-weight: 500 !important;    
          padding-left: 12px !important;  
          padding-right: 12px !important;
          transition: all 0.3s ease;     
      }
      
      /* 调整名字的字号 */
      .navbar-brand {
          font-size: 22px !important;     
      }
      
      /* 调整搜索框的文字大小，保持整体统一 */
      #search-input {
          font-size: 16px !important;
      }
    
      /* 保护加粗和斜体 */
      #experience .tab-content strong { font-weight: bold !important; color: inherit; }
      #experience .tab-content em { font-style: italic !important; color: inherit; }
      
      /* 5. DOI 小按钮 */
      #experience .tab-content p a {
          display: inline-block !important;
          margin-left: 8px;
          padding: 2px 8px;
          font-size: 13px !important;
          color: #007bff !important;
          border: 1px solid #007bff !important;
          border-radius: 4px;
          text-decoration: none !important;
          font-weight: normal !important;
          transition: all 0.3s ease;
      }
      #experience .tab-content p a:hover {
          background-color: #007bff !important;
          color: white !important;
      }

    /* ================= 学术服务 (并排4卡片) & 荣誉奖项 (单列) ================= */
      
      #projects img, #achievements img { display: none !important; }
    
      /* 1. 学术服务容器：开启横向弹性网格 */
      #projects .row {
          display: flex !important;
          flex-wrap: wrap !important;
          margin: 0 -10px !important; /* 抵消列间距 */
      }
    
      /* 2. 学术服务列：强行四等分 (25% 宽度) */
      #projects .row > div {
          flex: 0 0 25% !important;
          max-width: 25% !important;
          padding: 0 10px !important; /* 卡片之间的空隙 */
          display: flex !important;   /* 保证内部卡片等高 */
      }
    
      /* 3. 响应式：屏幕较小时自动变成 2 列或 1 列，防止挤爆 */
      @media (max-width: 1200px) {
          #projects .row > div { flex: 0 0 50% !important; max-width: 50% !important; margin-bottom: 20px !important; }
      }
      @media (max-width: 768px) {
          #projects .row > div { flex: 0 0 100% !important; max-width: 100% !important; }
      }
    
      /* 4. 荣誉奖项容器：因为只有一项，保持 100% 宽度的单列 */
      #achievements .row {
          display: block !important; 
          margin: 0 !important;
      }
      #achievements .row > div {
          flex: 0 0 100% !important;
          max-width: 100% !important;
          width: 100% !important;
          padding: 0 !important;
      }
    
      /* 5. 卡片外观 (透明底，完美适配夜间模式) */
      #projects .card, #achievements .card {
          background-color: transparent !important; /* 核心：背景完全透明 */
          border-radius: 8px !important;
          box-shadow: none !important; /* 去掉阴影，透明底加阴影会显得脏 */
          border: 1px solid rgba(128, 128, 128, 0.2) !important; /* 改用半透明边框，黑夜白昼都柔和 */
          width: 100% !important;
          margin-bottom: 20px !important; 
      }
      
      /* 调整内边距保持不变 */
      #projects .card-body { padding: 20px 15px !important; }
      #achievements .card-body { padding: 30px 40px !important; }
    
      /* 6. 小标题样式 (解除颜色锁定) */
      #projects h5, #achievements h5 {
          font-weight: bold !important;
          font-size: 18px !important; 
          color: inherit !important; /* 核心：跟随系统黑夜/白天模式自动变色 */
          border-bottom: 1px solid rgba(128, 128, 128, 0.2) !important; /* 半透明下划线 */
          padding-bottom: 8px;
          margin-top: 0 !important;    
          margin-bottom: 12px !important; 
          text-align: left !important;
      }
    
      /* 7. 正文样式 (解除颜色锁定) */
      #projects p, #projects .card-text, #projects div,
      #achievements p, #achievements .card-text, #achievements div {
          font-size: 14px !important; 
          line-height: 1.8 !important; 
          color: inherit !important; /* 核心：跟随系统自动变白/变黑，防止夜间模式看不见字 */
          text-align: left !important;
          white-space: pre-line !important; 
          margin-top: 0 !important;   
          padding-top: 0 !important;
      }


      /* ================= 消除首屏 (Hero) 区域巨大的底部留白 ================= */
      #hero, #hero .container {
          min-height: auto !important;    
          height: auto !important;
          padding-top: 80px !important;   
          padding-bottom: 40px !important;
      }

      /* 防止大屏下内容被强行垂直居中导致错位 */
      #hero .row {
          align-items: flex-start !important;
      }

      /* ================= 宽度布局约束 (全站 70% 居中) ================= */
          
      /* 1. 放大该版块的外层容器宽度 */
      #experience .container {
          max-width: 75% !important; 
      }
    
      /* 2. 突破内部的列宽限制，让白色卡片完全撑满上面的 70% 空间 */
      #experience .row > div {
          flex: 0 0 100% !important;
          max-width: 100% !important;
      }
          
      /* 3. 让卡片内部的文本区域也彻底释放 */
      #experience .card {
          width: 100% !important;
      }
    
      /* 约束特定版块为 75% 宽度并居中 */
      @media (min-width: 992px) {
          #projects .container, 
          #achievements .container {
              max-width: 80% !important;
              width: 80% !important;
              margin: 0 auto !important; /* 确保版块在屏幕正中间 */
          }
      }
    /* ================= 彻底消除卡片顶部幽灵占位框 ================= */
      
      /* 强力隐藏卡片里除了正文(.card-body)之外的所有东西（比如隐形的图片包装盒） */
      #projects .card > *:not(.card-body),
      #achievements .card > *:not(.card-body) {
          display: none !important;
          height: 0 !important;
          margin: 0 !important;
          padding: 0 !important;
      }

      /* 重新规范卡片的内边距，确保小标题乖乖贴近顶部边缘 */
      #projects .card-body {
          padding: 25px 15px !important; /* 控制四卡片的顶部和左右留白 */
      }
      #achievements .card-body {
          padding: 30px 40px !important; /* 控制底部大卡片的留白 */
      }
    /* ================= 修复 Honours and Awards 间距与灰色背景 ================= */
      
      /* 1. 缩小主标题 ("Honours and Awards") 与下方卡片的间距 */
      #achievements h2, 
      #achievements h3, 
      #achievements .section-title {
          margin-bottom: 15px !important; /* 缩小标题下方的距离 */
          padding-bottom: 0 !important;
      }
      #achievements .row {
          margin-top: 0 !important;
      }

      /* 2. 彻底清除卡片内部的灰色背景 (强制解除代码块伪装) */
      #achievements pre, 
      #achievements code,
      #achievements .card-text,
      #achievements p {
          background-color: transparent !important; /* 背景变透明 */
          background: none !important;
          border: none !important;                  /* 去掉可能存在的灰色边框 */
          padding: 0 !important;
          color: inherit !important;
          white-space: pre-line !important;         /* 保持我们之前的换行魔法 */
          font-family: Arial, sans-serif !important;/* 确保字体不变回等宽代码字体 */
      }
    
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function() {
          // 1. 定位 Email 按钮
          var emailBtn = document.querySelector('#hero a.btn');
          
          if (emailBtn && !document.getElementById('scholar-btn')) {
              // 2. 创建 Google Scholar 按钮
              var scholarBtn = document.createElement('a');
              scholarBtn.id = 'scholar-btn';
              
              /* 👇【请务必把这里换成你真正的 Google Scholar 地址】 */
              scholarBtn.href = "https://scholar.google.com/citations?user=s8ydqZYAAAAJ"; 
              
              scholarBtn.target = "_blank";
              scholarBtn.className = emailBtn.className; 
              // 加上小图标，显得更专业
              scholarBtn.innerHTML = '<i class="ai ai-google-scholar"></i> Google Scholar';
              
              // 3. 设置样式和间距
              scholarBtn.style.marginLeft = "15px";
              scholarBtn.style.display = "inline-flex";
              scholarBtn.style.alignItems = "center";
